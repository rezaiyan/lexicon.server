name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Gate for PRs and main: compile, full test suite and the JaCoCo coverage threshold.
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, json, subprocess, os

          root = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          c = next(e for e in root.findall('counter') if e.get('type') == 'LINE')
          pct = int(int(c.get('covered')) * 100 / (int(c.get('missed')) + int(c.get('covered'))))
          color = 'brightgreen' if pct >= 80 else ('yellow' if pct >= 70 else 'red')

          badge = json.dumps({"schemaVersion": 1, "label": "coverage", "message": f"{pct}%", "color": color})
          patch = json.dumps({"files": {"lexicon-coverage.json": {"content": badge}}})

          subprocess.run(
              ['gh', 'api', '--method', 'PATCH', f'/gists/{os.environ["GIST_ID"]}', '--input', '-'],
              input=patch, text=True, check=True
          )
          print(f"Coverage badge updated: {pct}% ({color})")
          PYEOF

  openrouter-model-check:
    name: OpenRouter Model Validation
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate OpenRouter model ID
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Default model from application.yml (production may override it with OPENROUTER_MODEL)
          MODEL_ID=$(grep -oP 'OPENROUTER_MODEL:\K[^}]+' src/main/resources/application.yml)
          echo "Default model ID: $MODEL_ID"

          if [ -z "$MODEL_ID" ]; then
            echo "::error::Could not extract the OPENROUTER_MODEL default from application.yml"
            exit 1
          fi

          HTTP_CODE=$(curl -sL -o /tmp/model-response.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL_ID\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}],\"max_tokens\":5}")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::OpenRouter model '$MODEL_ID' is invalid or unavailable (HTTP $HTTP_CODE)"
            cat /tmp/model-response.json
            exit 1
          fi

          CONTENT=$(cat /tmp/model-response.json | jq -r '.choices[0].message.content // empty')
          if [ -z "$CONTENT" ]; then
            echo "::error::Model returned empty response"
            cat /tmp/model-response.json
            exit 1
          fi

          echo "OpenRouter model validation passed: '$MODEL_ID' is valid"

  dependency-graph:
    # Uploads the resolved Gradle dependency graph (build.gradle.kts can't be parsed statically),
    # so Dependabot security alerts and the PR dependency review see the real versions.
    name: Dependency Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4

  dependency-review:
    # Fails a PR that adds or upgrades to a dependency with a known high/critical vulnerability.
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: dependency-graph
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          comment-summary-in-pr: on-failure
