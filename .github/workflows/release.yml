name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build JAR
        run: ./gradlew bootJar -x test --stacktrace

      - name: Rename JAR
        run: |
          mv build/libs/*.jar build/libs/lexicon-server-${{ steps.version.outputs.VERSION }}.jar

      - name: Extract changelog section
        id: changelog
        run: |
          # Pull the section between the first two version headers
          python3 - <<'PYEOF'
          import re, os

          text = open("CHANGELOG.md").read()
          # Match from first [X.Y.Z] header to the next one (or end of file)
          match = re.search(
              r"## \[\d+\.\d+\.\d+\][^\n]*\n(.*?)(?=\n## \[|\Z)",
              text,
              re.DOTALL,
          )
          notes = match.group(1).strip() if match else "See CHANGELOG.md for details."

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("NOTES<<EOF\n")
              f.write(notes + "\n")
              f.write("EOF\n")
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: build/libs/lexicon-server-${{ steps.version.outputs.VERSION }}.jar
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    # Versioned image (ghcr.io/<repo>:1.2.3 and :v1.2.3), deployable with the Deploy workflow
    name: Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
