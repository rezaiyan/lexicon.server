# Container logs rotate at 3 x 20 MB per service. Docker's default json-file driver never
# rotates, so logs would grow until the disk fills (and a full disk takes Postgres down).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # PostgreSQL Database (for production-like testing)
  postgres:
    image: postgres:17-alpine
    container_name: lexicon-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexicondb}
      POSTGRES_USER: ${POSTGRES_USER:-lexicon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 not exposed to host (app reaches postgres via Docker network).
    # Remove conflict if host PostgreSQL or another service uses 5432.
    networks:
      - lexicon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexicon_user} -d ${POSTGRES_DB:-lexicondb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Lexicon Server Application
  app:
    # CI publishes this image for every main commit; scripts/deploy.sh sets APP_IMAGE_TAG in .env.
    # `docker compose build app` still builds it locally from the Dockerfile.
    image: ghcr.io/rezaiyan/lexicon.server:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexicon-server
    logging: *default-logging
    # The JVM sizes its heap from this (-XX:MaxRAMPercentage=75 in the Dockerfile); without a limit
    # it would size against the whole VPS, which Postgres and Metabase share.
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # One JSON object per log line (Elastic Common Schema) incl. MDC requestId and access-log fields;
      # set LOG_FORMAT= (empty) in .env for plain text while debugging on the box
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT-ecs}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lexicondb}
      DATABASE_USERNAME: ${POSTGRES_USER:-lexicon_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-7776000000}
      JWT_REFRESH_TOKEN_GRACE_PERIOD_MS: ${JWT_REFRESH_TOKEN_GRACE_PERIOD_MS:-30000}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/keys/jwt-private-key.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/keys/jwt-public-key.pem}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      REVENUECAT_WEBHOOK_SIGNING_SECRET: ${REVENUECAT_WEBHOOK_SIGNING_SECRET:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-com.alirezaiyan.vokab}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      TEST_EMAILS: ${TEST_EMAILS:-}
      CI_TEST_AUTH_ENABLED: ${CI_TEST_AUTH_ENABLED:-false}
      CI_TEST_SECRET: ${CI_TEST_SECRET:-}
      CI_TEST_EMAIL: ${CI_TEST_EMAIL:-ci-maestro@test.vokab.dev}
      VOCABULARY_SUGGESTION_COUNT: ${VOCABULARY_SUGGESTION_COUNT:-50}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-Lexicon <noreply@lexicon.app>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-/var/www/uploads/avatars}
      AVATAR_BASE_URL: ${AVATAR_BASE_URL:-}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ADMIN_NOTIFICATIONS_ENABLED: ${ADMIN_NOTIFICATIONS_ENABLED:-true}
      # X-Admin-Key for /admin/** and the dashboard at /admin-ui/notifications.
      # Empty disables admin access; dashboard sign-in needs 32+ chars (openssl rand -base64 36)
      APP_SECURITY_ADMINAPIKEY: ${APP_SECURITY_ADMINAPIKEY:-}
      PORT: 8080
    volumes:
      # Persist JWT keys across container restarts
      - jwt_keys:/app/keys
      # Persist avatar uploads
      - avatar_uploads:/var/www/uploads/avatars
    ports:
      - "127.0.0.1:8080:8080"  # Localhost only; use nginx (HTTPS) for external access
    networks:
      - lexicon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Metabase Analytics Dashboard
  metabase:
    # Pinned: `latest` could jump a major version on any restart, and Metabase can't downgrade its
    # application database. Dependabot proposes upgrades.
    image: metabase/metabase:v0.64.1.5
    container_name: lexicon-metabase
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - lexicon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  jwt_keys:  # Persist JWT RSA keys across container restarts
  avatar_uploads:  # Persist avatar uploads across container restarts
  metabase_data:  # Persist Metabase settings and dashboards

networks:
  lexicon-network:
    driver: bridge
