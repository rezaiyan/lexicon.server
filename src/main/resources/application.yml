spring:
  application:
    name: vokab-server

  # Empty defaults on purpose: without DATABASE_URL startup fails ("Failed to configure a DataSource")
  # instead of silently using a dev database; H2 is not on the production classpath.
  # Local development: SPRING_PROFILES_ACTIVE=h2 (application-h2.yml). Driver comes from the URL.
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # With virtual threads request concurrency is effectively unbounded; the pool is what caps
      # concurrent DB work. Waiting longer than this for a connection fails the request instead of
      # piling up threads behind an overloaded database.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000   # ms (Hikari binds a raw long, not a Duration)

  # Requests, @Async and @Scheduled run on virtual threads (all I/O here is blocking JDBC/HTTP).
  threads:
    virtual:
      enabled: true
  task:
    execution:
      simple:
        # Bounds fire-and-forget @Async work (audit log, events, geo lookup) so it can't drain the pool
        concurrency-limit: 16
    scheduling:
      simple:
        # Each cron run gets a fresh virtual thread; 1 keeps the jobs serialized as before, so a slow
        # notification dispatch can never overlap itself and double-send.
        concurrency-limit: 1

  sql:
    init:
      mode: never
      schema-locations: []

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # Dialect is detected from the JDBC connection (PostgreSQL in prod, H2 in dev/tests).
        format_sql: true
        # Paginating a query that fetch-joins a collection pages in memory over every row; fail instead
        query:
          fail_on_pagination_over_collection_fetch: true

  h2:
    console:
      enabled: false   # only the h2 profile turns it on
      path: /h2-console

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 6MB

app:
  avatar:
    upload-dir: ${AVATAR_UPLOAD_DIR:/var/www/uploads/avatars}
    base-url: ${AVATAR_BASE_URL:}

  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:7776000000}
    refresh-token-grace-period-ms: ${JWT_REFRESH_TOKEN_GRACE_PERIOD_MS:30000}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:vokab-server}
    audience: ${JWT_AUDIENCE:vokab-client}

  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:anthropic/claude-haiku-4.5}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}

  apple:
    # Accepted `aud` values for Apple ID tokens (iOS bundle id; add a Services ID if web sign-in ships).
    client-ids: ${APPLE_CLIENT_IDS:com.alirezaiyan.vokab}

  vocabulary:
    # How many vocabulary items to ask the AI to generate
    # for onboarding and suggest-vocabulary flows.
    # Can be overridden via VOCABULARY_SUGGESTION_COUNT in the environment.
    suggestionCount: ${VOCABULARY_SUGGESTION_COUNT:50}

  # AI credits (see CreditService). Allowances reset monthly per tier and never roll over; the
  # signup bonus never expires. The app reads costs and allowances from GET /api/v1/credits.
  credits:
    signup-bonus: ${CREDITS_SIGNUP_BONUS:15}
    free-monthly-allowance: ${CREDITS_FREE_MONTHLY:5}
    trial-monthly-allowance: ${CREDITS_TRIAL_MONTHLY:30}
    premium-monthly-allowance: ${CREDITS_PREMIUM_MONTHLY:300}
    costs:
      PHOTO_EXTRACTION: ${CREDITS_COST_PHOTO:2}
      AI_SUGGESTION: ${CREDITS_COST_SUGGESTION:2}
      TEXT_TRANSLATION: ${CREDITS_COST_TRANSLATION:1}

  # Per-user call limits on the AI endpoints; each limit resets in full every window.
  rate-limit:
    window-minutes: ${AI_RATE_LIMIT_WINDOW_MINUTES:5}
    photo-calls: ${AI_RATE_LIMIT_PHOTO_CALLS:20}
    ai-calls: ${AI_RATE_LIMIT_AI_CALLS:50}

  revenuecat:
    # Authorization header value set on the RevenueCat webhook. Empty = every webhook is rejected.
    webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:}
    # Optional HMAC signing secret ("HMAC webhook signing" in RevenueCat). Set = signature required.
    webhook-signing-secret: ${REVENUECAT_WEBHOOK_SIGNING_SECRET:}
    webhook-signature-tolerance-seconds: ${REVENUECAT_WEBHOOK_SIGNATURE_TOLERANCE_SECONDS:300}
    # Secret (sk_) key. Empty disables subscription sync + reconcile.
    api-key: ${REVENUECAT_API_KEY:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

  features:
    push-notifications-enabled: ${PUSH_NOTIFICATIONS_ENABLED:true}

  firebase:
    # Service account JSON file for push notifications; FIREBASE_CREDENTIALS_JSON (the JSON itself) wins
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

  security:
    # Comma-separated list of test emails that bypass active check
    # Set in environment variable: TEST_EMAILS=email1@example.com,email2@example.com
    testEmails: ${TEST_EMAILS:}

  logging:
    # One access-log line per request (AccessLogFilter)
    enabled: ${REQUEST_LOGGING_ENABLED:true}
    exclude-patterns: ${REQUEST_LOGGING_EXCLUDE_PATTERNS:/api/v1/health,/actuator/**,/h2-console/**}

  email:
    enabled: ${EMAIL_ENABLED:false}
    provider: ${EMAIL_PROVIDER:log}
    api-key: ${EMAIL_API_KEY:}
    from-address: ${EMAIL_FROM_ADDRESS:Lexicon <noreply@lexicon.app>}
    reply-to: ${EMAIL_REPLY_TO:}
    smtp-host: ${EMAIL_HOST:}
    smtp-port: ${EMAIL_PORT:465}
    smtp-user: ${EMAIL_USER:}
    smtp-password: ${EMAIL_PASSWORD:}

  ci-auth:
    enabled: ${CI_TEST_AUTH_ENABLED:false}
    secret: ${CI_TEST_SECRET:}
    test-email: ${CI_TEST_EMAIL:ci-maestro@test.vokab.dev}

  notifications:
    admin:
      enabled: ${ADMIN_NOTIFICATIONS_ENABLED:true}
      telegram:
        bot-token: ${TELEGRAM_ADMIN_BOT_TOKEN:}
        chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}

  geolocation:
    database-path: ${GEOLITE2_COUNTRY_DB_PATH:}

logging:
  level:
    root: INFO
    com.alirezaiyan.vokab: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.springframework.boot.actuate: OFF
    org.hibernate: ERROR

management:
  server:
    # Actuator lives on its own port: not published by docker-compose and not routed by Caddy
    # (which only forwards /api/* to 8080), so metrics and health details stay internal.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /readiness (internal port). Readiness = can serve traffic:
      # app state + database. Firebase/OpenRouter stay out: their outages degrade single features.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

# The spec is rendered by OpenApiContractTest into openapi.json; no public docs route.
springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

# Cross-feature events (Spring Modulith): persisted in event_publication until each listener completes.
# The table is created by Flyway (V39); completed rows are deleted, failed ones are retried by
# EventPublicationRetry.
spring.modulith:
  events:
    jdbc:
      schema-initialization:
        enabled: false
    completion-mode: delete
    republish-outstanding-events-on-restart: false
