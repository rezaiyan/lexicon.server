spring:
  datasource:
    # Testcontainers JDBC URL: starts postgres:17-alpine (prod's major) on first connection.
    # TC_DAEMON keeps one container for the whole test JVM, shared by every cached Spring context.
    url: jdbc:tc:postgresql:17-alpine:///vokab?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    hikari:
      # Spring caches a context per distinct test config (~25), each with its own pool. At the
      # default 10 connections they exhaust PostgreSQL's max_connections=100 and the suite hangs.
      maximum-pool-size: 2
      minimum-idle: 0
      # A test that waits on its own open transaction (e.g. REQUIRES_NEW deleting a row the outer
      # test transaction references) fails after 10s instead of hanging the whole suite.
      connection-init-sql: SET lock_timeout = '10s'
  test:
    database:
      # Never swap in an embedded database for @DataJpaTest
      replace: none

  # The real migrations build the schema, so tests run against exactly what prod runs.
  flyway:
    enabled: true

  jpa:
    hibernate:
      # Fails the context if an entity drifts from the migrations
      ddl-auto: validate
